services:
  tts:
    build: .
    container_name: kokoro-tts
    ports:
      - "8880:8880"
    environment:
      # Ollama runs on the Unraid host (its own container, port published on the host)
      - OLLAMA_URL=http://host.docker.internal:11434
      # TTS + STT enabled; the chat demo (/chat/speak, llama3.2:3b) stays off
      - CHAT_ENABLED=0
      - STT_ENABLED=1
      # Whole service stays off the GPU (see README - this is deliberate)
      - ONNX_PROVIDER=CPUExecutionProvider
      - OLLAMA_FORCE_CPU=1
      # HYG-16 (2026-09-24): no model-based normalisation. Stage 1 (regex:
      # markdown/emoji/URLs) stays on; the Ollama step shared qwen2.5:1.5b with
      # Coach input grounding at a different context size, forcing constant
      # reloads that made grounding time out. Empty = no models, no warm-up.
      # start.sh's ${VAR:-default} re-applies the qwen2.5/gemma3 defaults on a bare-metal start.
      - NORM_LLM_PRIMARY=
      - NORM_LLM_SECONDARY=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Model weights (Kokoro ~330MB + Parakeet ~660MB) live in the repo's
      # models/, not baked into the image
      - ./models:/app/models:ro
      # normalization audit log persists in the repo dir (gitignored)
      - ./flagged_log.jsonl:/app/flagged_log.jsonl
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8880/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # boot loads Kokoro + Parakeet + warms the normalizers, so give it room
      start_period: 90s
    restart: unless-stopped
